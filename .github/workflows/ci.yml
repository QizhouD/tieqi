name: ci

on:
  push:
  pull_request:

jobs:
  windows-msvc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Source language
        shell: bash
        run: |
          if command -v python3 >/dev/null 2>&1; then
            python3 tools/check_source_language.py
          else
            python tools/check_source_language.py
          fi

      - name: MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: build/ci/_deps
          key: ${{ runner.os }}-msvc-${{ hashFiles('cmake/Dependencies.cmake') }}
          restore-keys: ${{ runner.os }}-msvc-

      - name: Configure
        run: cmake --preset ci

      - name: Build
        run: cmake --build --preset ci

      - name: Test
        run: ctest --preset ci

      - name: Headless smoke
        run: .\build\ci\tq_headless.exe --scenario byeokjegwan --seed 1 --runs 3 --policy scripted --max-ticks 18000

      - name: Core purity
        shell: bash
        run: |
          set -euo pipefail
          status=0
          matches=$(grep -RInE '#include[[:space:]]*<SFML|imgui|#include[[:space:]]*<filesystem>' src/core) || status=$?
          if [[ $status -eq 0 ]]; then
            printf '%s\n' "$matches"
            echo "src/core must not include SFML, imgui, or <filesystem>"
            exit 1
          elif [[ $status -ne 1 ]]; then
            echo "purity check failed to scan src/core"
            exit "$status"
          fi

  ubuntu-gcc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Source language
        shell: bash
        run: |
          if command -v python3 >/dev/null 2>&1; then
            python3 tools/check_source_language.py
          else
            python tools/check_source_language.py
          fi

      - name: SFML system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++ cmake ninja-build xz-utils pkg-config \
            libxrandr-dev libxcursor-dev libxi-dev libudev-dev libfreetype-dev \
            libflac-dev libvorbis-dev libgl1-mesa-dev libegl1-mesa-dev libharfbuzz-dev

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: build/ci/_deps
          key: ${{ runner.os }}-gcc-${{ hashFiles('cmake/Dependencies.cmake') }}
          restore-keys: ${{ runner.os }}-gcc-

      - name: Configure
        run: cmake --preset ci

      - name: Build
        run: cmake --build --preset ci

      - name: Test
        run: ctest --preset ci

      - name: Headless smoke
        run: ./build/ci/tq_headless --scenario byeokjegwan --seed 1 --runs 3 --policy scripted --max-ticks 18000

      - name: Core purity
        shell: bash
        run: |
          set -euo pipefail
          status=0
          matches=$(grep -RInE '#include[[:space:]]*<SFML|imgui|#include[[:space:]]*<filesystem>' src/core) || status=$?
          if [[ $status -eq 0 ]]; then
            printf '%s\n' "$matches"
            echo "src/core must not include SFML, imgui, or <filesystem>"
            exit 1
          elif [[ $status -ne 1 ]]; then
            echo "purity check failed to scan src/core"
            exit "$status"
          fi
